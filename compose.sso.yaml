name: risk-desk

# Демо с SSO: docker compose -f compose.yaml -f compose.sso.yaml up --build
# Поднимает Keycloak с готовым realm и включает OIDC в приложении.
# Логин в панель: marketer@example.test / marketer123 (через кнопку SSO)
# Консоль Keycloak: http://localhost:8081 (admin / admin)

services:
  app:
    environment:
      OIDC_ISSUER: http://localhost:8081/realms/risk-desk
      OIDC_CLIENT_ID: risk-desk
      OIDC_CLIENT_SECRET: dev-secret-risk-desk
      OIDC_REDIRECT_URI: http://localhost:8000/api/v1/auth/oidc/callback
      OIDC_INTERNAL_BASE: http://keycloak:8080/realms/risk-desk
      OIDC_PROVIDER_NAME: Keycloak
    depends_on:
      keycloak:
        condition: service_started

  keycloak:
    image: quay.io/keycloak/keycloak:26.0
    command: ["start-dev", "--import-realm"]
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin
      KC_HOSTNAME: http://localhost:8081
      KC_HTTP_ENABLED: "true"
    ports:
      - "${KC_PORT:-8081}:8080"
    volumes:
      - ./deploy/keycloak:/opt/keycloak/data/import:ro
    restart: unless-stopped
