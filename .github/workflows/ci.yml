name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Зависимости
        run: python -m pip install -r backend/requirements-dev.txt
      - name: Тесты
        env:
          PYTHONPATH: backend
        run: python -m pytest -q backend/tests data/raw/test_generate.py
      - name: OpenAPI синхронен с приложением
        env:
          PYTHONPATH: backend
        run: |
          python scripts/export_openapi.py
          git diff --exit-code openapi.json

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - name: Типы и сборка
        run: npm run build
        working-directory: frontend

  compose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Базовый compose валиден без .env
        run: docker compose config -q
      - name: Compose с SSO валиден
        run: docker compose -f compose.yaml -f compose.sso.yaml config -q
      - name: Сборка образа
        run: docker build -t risk-desk:ci .
