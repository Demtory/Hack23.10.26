name: risk-desk

# Запуск по умолчанию: docker compose up --build
# Ничего настраивать не нужно: значения ниже — рабочие демо-умолчания.
# Файл .env необязателен; если он есть, compose подхватит из него переменные.

services:
  app:
    build: .
    image: risk-desk:local
    ports:
      - "${APP_PORT:-8000}:8000"
    environment:
      APP_DB: /data/app.db
      SEED_PATH: /app/data/seed.json
      SEED_ON_START: ${SEED_ON_START:-true}
      AS_OF: ${AS_OF:-2026-10-23T18:00:00Z}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@example.test}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-admin123}
      SESSION_HOURS: ${SESSION_HOURS:-12}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
    volumes:
      - app-data:/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/healthz')"]
      interval: 15s
      timeout: 3s
      retries: 5
    restart: unless-stopped

volumes:
  app-data:
