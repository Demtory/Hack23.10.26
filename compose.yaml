name: risk-desk

services:
  app:
    build: .
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      APP_DB: /data/app.db
      SEED_PATH: /app/data/seed.json
      AS_OF: ${AS_OF:-2026-10-23T18:00:00Z}
    volumes:
      - app-data:/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/healthz')"]
      interval: 15s
      timeout: 3s
      retries: 5
    restart: unless-stopped

volumes:
  app-data:
